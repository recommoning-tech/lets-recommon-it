<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-two-keyholders d-two-keyholders">
<title id="t-two-keyholders">Two Keyholders</title>
<desc id="d-two-keyholders">Sketch: a small shared tool shed stands in the middle; its door is hatched. On the left, a mannequin turns a key in the door. On the right, a second mannequin walks away carrying a bag, with its own key in the other hand. The shed is the shared system from the pattern's context: something a group depends on. Its door is admin access, the focus. Each figure is a keyholder and each key is full access. The figure leaving with a bag is the problem the pattern guards against, a keyholder who moves away or burns out; the first figure opening the door anyway is the consequence, the system surviving one person leaving. That the first figure is using the key, not just holding it, is the second half of the solution: both keyholders use their access regularly. The metaphor: a shared shed with two keys cut, so the tools stay within reach whoever is away.</desc>
<defs><filter id="rough-two-keyholders" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="14"/><feDisplacementMap in="SourceGraphic" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter></defs>
