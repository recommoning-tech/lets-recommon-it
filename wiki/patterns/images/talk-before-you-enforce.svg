<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-talk-before-you-enforce d-talk-before-you-enforce">
<title id="t-talk-before-you-enforce">Talk Before You Enforce</title>
<desc id="d-talk-before-you-enforce">Diagram in plan view, seen from above: six people stand in a ring facing a hatched open space in the middle, with small arcs of speech between them. Outside the ring, a fence panel lies flat on the ground. The ring of people is the group sharing a system, from the pattern's context. The hatched space between them is the solution's place to talk, such as a chat channel or a regular check-in, and the speech arcs are problems being raised there first. The fence panel is enforcement: quotas, permissions, bans. It lies set aside, not built: available if the group chooses it, but not the first response. The metaphor: a commons as a shared clearing where people meet in the open, instead of fencing each other off.</desc>
