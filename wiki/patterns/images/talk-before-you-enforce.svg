<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-talk-before-you-enforce d-talk-before-you-enforce">
<title id="t-talk-before-you-enforce">Talk Before You Enforce</title>
<desc id="d-talk-before-you-enforce">Diagram in plan view, seen from above: six people sit around a round table, which is hatched, with small arcs of speech between them. Off to the right, a fence panel lies flat on the ground, unused. The people are the group sharing a system, from the pattern's context, now with problems to deal with. The round table is the solution: a place for the group to talk, such as a chat channel or a regular check-in, and it is the focus. The speech arcs are a problem being raised there first, with everyone, rather than decided by an admin alone. The fence panel is technical enforcement such as quotas, permissions, and bans: set aside, not built, and still available if the group chooses it later. The metaphor: a round table with no head, where the group's own judgment comes before any fence.</desc>
