<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-any-cell-any-time d-any-cell-any-time">
<title id="t-any-cell-any-time">Any Cell, Any Time</title>
<desc id="d-any-cell-any-time">Sketch: a patchwork quilt hangs from a line between two posts, three squares across and three down, with a square, a triangle, and a diamond above its columns and a thread circle beside each row. Most squares are already sewn with simple stitched designs; one is empty. A mannequin reaches up to fit a single hatched patch into the empty square. The quilt is the site's table: its columns are guides, governance, and theory (the square, triangle, and diamond) and its rows are threads. The sewn squares are pieces other people have already contributed. The hatched patch is one contribution, the focus: a single guide, governance piece, essay, or pattern. Adding it while the rest of its row is unfinished is the solution: accept a contribution to any single cell at any time. The metaphor: a community quilt, made one patch at a time by whoever has one ready, and uneven until it's done.</desc>
