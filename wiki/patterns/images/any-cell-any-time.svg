<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-any-cell-any-time d-any-cell-any-time">
<title id="t-any-cell-any-time">Any Cell, Any Time</title>
<desc id="d-any-cell-any-time">Sketch: a mannequin slots one card into a single empty cell of a large three-by-three grid. The columns are marked above with a square, a triangle, and a diamond, and a few other cells already hold cards. The new card is hatched. The grid is the site's table: its columns are guides, governance, and theory (the square, triangle, and diamond), and its rows are threads. The hatched card is one contribution: a single guide, governance piece, essay, or pattern. Slotting it into one cell while the rest of its row stays unfinished is the solution: accept a contribution to any single cell at any time, without waiting for the rest of the row. The cards already in place are other people's earlier contributions. The metaphor: the site as a shared wall of pigeonholes, filled one slot at a time by whoever has something to put there.</desc>
<defs><filter id="rough-any-cell-any-time" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="17"/><feDisplacementMap in="SourceGraphic" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter></defs>
