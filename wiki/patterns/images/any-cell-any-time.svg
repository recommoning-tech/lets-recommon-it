<title id="t-any-cell-any-time">Any Cell, Any Time</title>
<desc id="d-any-cell-any-time">Sketch: a mannequin places one card into a single empty cell of a large three-by-three grid whose columns are labeled guides, governance, and theory. A few cells are already hatched. The note reads "one cell at a time".</desc>
