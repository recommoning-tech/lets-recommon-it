<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-every-page-links-out d-every-page-links-out">
<title id="t-every-page-links-out">Every Page Links Out</title>
<desc id="d-every-page-links-out">Diagram in plan view: in open water, a hatched island in the middle with a page drawn on it is joined by small plank bridges to four other islands. The four islands carry, in turn, a small grid, a card with a circle on it, a closed book, and a thread circle. Each island is a page on the site. The open water between them is the problem: pages written one at a time drift apart, and a reader who lands on one never reaches the rest. The hatched middle island is any single page, the focus. Its bridges are its links, the solution: the grid island is the table, the card is a pattern the page introduces or applies, the book is the sources it draws on, and the thread circle is the other pieces in its thread. The metaphor: the site as an archipelago. A page with no bridges is an island in the bad sense.</desc>
