<title id="t-solution-first">Solution First</title>
<desc id="d-solution-first">Sketch: a mannequin writes on a large card propped on an easel. Only the middle section of the card, the solution, has been written and is hatched; the sections above and below and the title line at the top are still blank.</desc>
