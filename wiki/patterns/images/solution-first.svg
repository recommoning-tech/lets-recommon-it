<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-solution-first d-solution-first">
<title id="t-solution-first">Solution First</title>
<desc id="d-solution-first">Sketch in perspective: a large card leans back on a three-legged easel, seen from its front corner, and a mannequin stands beside it writing with a pencil. Only one section in the middle of the card has been written, and it is hatched; the sections above and below it, and a dashed title line at the top, are still blank. The card is a pattern being drafted, laid out like this site's pattern pages. The written middle section is the solution, the focus: the one thing the writer most wants to share, written first. The blank sections around it are the problem, context, forces, and consequences, worked out from the solution afterwards. The empty title line is the pattern's name, which the solution says to write last. The figure writing is anyone with experience to pass on. The metaphor: writing a pattern from the inside out, starting with what you would tell a newcomer and only then explaining when and why.</desc>
