<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-patterns-are-tested-in-practice d-patterns-are-tested-in-practice">
<title id="t-patterns-are-tested-in-practice">Patterns Are Tested in Practice</title>
<desc id="d-patterns-are-tested-in-practice">Sketch: a mannequin holds a pattern card up beside a doorway it has built. On the card is a small drawing of a door narrower than the real one, and the figure is redrawing it wider with a pencil. The card is hatched. The doorway is practice: something actually built. The card is the pattern itself, the focus. Holding the card up against the real door is the first half of the solution: applying the pattern somewhere besides the piece that introduced it. The door on the card being too narrow is a pattern that doesn't fit what really happened, and the pencil redrawing it is the second half: revise the pattern and note why. The metaphor: a pattern as a plan, checked against the building, so the plan changes to fit the building and not the other way round.</desc>
