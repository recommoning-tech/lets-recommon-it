<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-patterns-are-tested-in-practice d-patterns-are-tested-in-practice">
<title id="t-patterns-are-tested-in-practice">Patterns Are Tested in Practice</title>
<desc id="d-patterns-are-tested-in-practice">Sketch: one mannequin stands with its arms held out while a second holds a hatched paper sewing pattern against it. The pattern's sleeve stops short of the wrist, and the second figure is drawing a dashed line with a pencil to lengthen it. The paper sewing pattern is one of this site's patterns, the focus. It was cut for someone else; holding it against a different person is the first half of the solution: apply the pattern in a piece besides the one that introduced it. The figure with its arms out is the practice the pattern meets: a real group or server. The short sleeve is a pattern that doesn't fit what happens in practice, and the pencil lengthening it is the second half of the solution: revise the pattern and say why. The metaphor: a pattern in the dressmaker's sense, a template that proves itself only when it's tried on, and is altered when it doesn't fit.</desc>
