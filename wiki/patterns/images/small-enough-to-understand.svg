<title id="t-small-enough-to-understand">Small Enough to Understand</title>
<desc id="d-small-enough-to-understand">Sketch: one mannequin holds a small server while a second leans in to learn it, both inside a dashed circle labeled "a weekend to learn". To the right, a large rack is crossed out with the note "not yet".</desc>
