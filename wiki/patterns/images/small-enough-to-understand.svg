<title id="t-small-enough-to-understand">Small Enough to Understand</title>
<desc id="d-small-enough-to-understand">Sketch: at a workbench, one mannequin points to a few small parts laid out side by side while a second leans in to look. Above the bench, a shelf holds one box beside a dashed outline of space left for another. The parts are hatched.</desc>
